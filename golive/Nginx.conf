# nginx site: go-live org local userspace
server {
    listen 8099;
    server_name localhost;

    root /root/projects/twitterstorm/golive;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API server (secrets-wrapping backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
