name = "RequestProject"
version = "0.1.0"
defaultTargets = ["RequestProject"]

# NO [[require]] = no mathlib, no network, fast for CI

# Roots are dotted MODULE NAMES resolved from the package srcDir:
# RequestProject/Twin.lean is the module `RequestProject.Twin`. A bare
# `dir = "RequestProject"` + bare-root spelling does NOT scope roots (lake
# resolves bare `Twin` to the top-level minimal/Twin.lean instead).
#
# Main, ProxyReport and the Protocol/Proxy subtrees rejoined 2026-10-18:
# the RequestProject/{Protocol,Proxy} trees were applied from aristo run
# 58ae717d (self-export 2026-09-19) and Main no longer imports Mathlib
# (no-mathlib policy; the Mathlib-only scoped opens went with it). The
# Decouple/TrustCapsule modules come from aristo run 749a6eb8 (2026-10-18) —
# only its no-mathlib, import-closed subset: Mobius/Fitting/Ontology
# (`public import Mathlib`) and Nesting/Tolerance/Introspection/SelfApply/
# Experiments (imports of modules absent from the run export) were left out.
[[lean_lib]]
name = "RequestProject"
roots = [
  "RequestProject.Agent", "RequestProject.APICapabilities", "RequestProject.CommandExecution",
  "RequestProject.CreditUsage", "RequestProject.ExecutionTrace", "RequestProject.ToolProvenance",
  "RequestProject.Twin", "RequestProject.Main", "RequestProject.ProxyReport",
  "RequestProject.Analyzer", "RequestProject.Classify", "RequestProject.Chunks",
  "RequestProject.Reflect", "RequestProject.ReflectGraph", "RequestProject.Demo",
  "RequestProject.Synonyms", "RequestProject.ModuleDeps", "RequestProject.Schema",
  "RequestProject.Fingerprint", "RequestProject.TrustPolynomial", "RequestProject.TrustPolynomialSpec",
  "RequestProject.TrustCapsule", "RequestProject.TrustCapsuleMeasured"
]

[[lean_lib]]
name = "RequestProject.Proxy"
roots = ["RequestProject.Proxy.Concrete", "RequestProject.Proxy.Core", "RequestProject.Proxy.Dashboard", "RequestProject.Proxy.Example", "RequestProject.Proxy.Export", "RequestProject.Proxy.Interop", "RequestProject.Proxy.Monitor"]

[[lean_lib]]
name = "RequestProject.Protocol"
roots = ["RequestProject.Protocol.Client", "RequestProject.Protocol.Core", "RequestProject.Protocol.Example", "RequestProject.Protocol.Server", "RequestProject.Protocol.Soundness"]

# One root pulls in all 36 per-plugin context modules. (The previous bare-root
# list resolved to top-level minimal/*.lean, which never compiled — Mathlib
# tactics without Mathlib; the compiling copies now live in
# RequestProject/PluginContexts/, one sub-namespace per module.)
[[lean_lib]]
name = "RequestProject.PluginContexts"
deps = ["RequestProject"]
roots = ["RequestProject.PluginContexts.AllModules"]

[[lean_exe]]
name = "proxy_report"
root = "ProxyReport"

# Add gokujo to the project

# lake roots are module names, never file paths — no `.lean` suffix.
[[lean_lib]]
name = "Gokujo"
roots = ["Gokujo", "GokujoMain"]

# Add execution scripts for agent-c and testing
# lake roots are dotted MODULE NAMES, not file paths: AgentC/main.lean → AgentC.main

[[lean_exe]]
name = "agent-c"
root = "AgentC.main"

# Add test suite scripts
# tests/run/main.lean → tests.run.main (dotted module name, not a path)

[[lean_exe]]
name = "test-suite"
root = "tests.run.main"

# Cache configuration for fast builds
cache = { enabled = true, directory = ".lake/cache" }

# Override leanc options for no-network builds
# (Lean's lakefile doesn't expose this, but we rely on caches)

# Explicitly disable mathlib in lake config
# No [[require]] = no mathlib

# Fast build settings (subset of optimizations)
# TOML inline tables must be one line — a multi-line one is a syntax error.
options = { transparency = true, logging = false }