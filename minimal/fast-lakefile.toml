name = "RequestProject"
version = "0.1.0"
defaultTargets = ["RequestProject"]

# NO [[require]] = no mathlib, no network, fast for CI

# Roots are dotted MODULE NAMES resolved from the package srcDir:
# RequestProject/Twin.lean is the module `RequestProject.Twin`. A bare
# `dir = "RequestProject"` + bare-root spelling does NOT scope roots (lake
# resolves bare `Twin` to the top-level minimal/Twin.lean instead).
#
# Main and ProxyReport are deliberately NOT roots here:
#   * Main imports Mathlib and RequestProject.{Protocol,Proxy}.* — neither
#     exists in this tree (no-mathlib policy; Proxy/Protocol live only at
#     the top level as Proxy/ and Protocol/);
#   * ProxyReport imports RequestProject.Proxy.Export, also absent.
# They rejoin once those subtrees exist.
[[lean_lib]]
name = "RequestProject"
roots = ["RequestProject.Agent", "RequestProject.APICapabilities", "RequestProject.CommandExecution", "RequestProject.CreditUsage", "RequestProject.ExecutionTrace", "RequestProject.ToolProvenance", "RequestProject.Twin"]

[[lean_lib]]
name = "RequestProject.Proxy"
roots = ["Concrete", "Core", "Dashboard", "Example", "Export", "Interop", "Monitor"]

[[lean_lib]]
name = "RequestProject.Protocol"
roots = ["Client", "Core", "Example", "Server", "Soundness"]

[[lean_lib]]
name = "RequestProject.PluginContexts"
deps = ["RequestProject"]
roots = [
  "activity_profile", "aristotle_manager", "aristotle_tools", "cid_index_lean",
  "dir_to_shmem", "eco_research", "emacs_search", "erdfa_publish", "forgecode",
  "forgecode_extras", "forge_plugin_tantivy", "git_tools", "harbor", "hive_driver",
  "index_to_shmem", "ipld_car_shmem_client", "ipld_car_shmem_server",
  "lean4_block_server", "lean4_cbor_bridge", "lean4_repl", "lean4_twin",
  "letta_ipld_memory", "monster_hecke", "monster_voa", "observer_qa",
  "omnisearch", "omnisearch_config", "parquet_index", "proof_robot",
  "repo_headers", "shard_tools", "shmem_dedup", "shmem_optimize", "shmem_warm",
  "spec_to_proof", "spool", "spool_source", "tantivy_indexer", "task_manager",
  "test_tag_42", "tokenizer", "zombie_driver", "zos_a11y_gui", "zos_github_manager",
  "zos_noc_manager", "zos_plugin_generators"
]

[[lean_exe]]
name = "proxy_report"
root = "ProxyReport"

# Add gokujo to the project

# lake roots are module names, never file paths — no `.lean` suffix.
[[lean_lib]]
name = "Gokujo"
roots = ["Gokujo", "GokujoMain"]

# Add execution scripts for agent-c and testing
# lake roots are dotted MODULE NAMES, not file paths: AgentC/main.lean → AgentC.main

[[lean_exe]]
name = "agent-c"
root = "AgentC.main"

# Add test suite scripts
# tests/run/main.lean → tests.run.main (dotted module name, not a path)

[[lean_exe]]
name = "test-suite"
root = "tests.run.main"

# Cache configuration for fast builds
cache = { enabled = true, directory = ".lake/cache" }

# Override leanc options for no-network builds
# (Lean's lakefile doesn't expose this, but we rely on caches)

# Explicitly disable mathlib in lake config
# No [[require]] = no mathlib

# Fast build settings (subset of optimizations)
# TOML inline tables must be one line — a multi-line one is a syntax error.
options = { transparency = true, logging = false }